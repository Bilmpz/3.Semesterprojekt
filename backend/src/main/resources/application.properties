spring.application.name=backend

spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}


# ============================================================
# Cendo transfer-analysis pipeline - configuration
# ============================================================

# --- Data ---
dataset.path=data/syntetisk_voice_agent_dataset_analyseklart_500.xlsx
# train | validation | test | all  (tune parameters on train/validation, run test once at the end)
dataset.split=train

# --- Pipeline ---
# REASON_FIRST    = LLM extracts the transfer reason -> embed reasons -> cluster   (pipeline 1)
# FULL_TRANSCRIPT = embed the whole transcript directly -> cluster                 (pipeline 2)
pipeline.mode=REASON_FIRST


# ID: T2 – Ollama kører lokalt
ollama.url=http://localhost:11434


# **NYT**
# PipelineConfig læser config.properties manuelt
# Spring Boot kan automatisk læse indstillignerne via "application.properties", hvilket A2 opgaven kræver.
# Vi vil bare gerne integrere dem med spring.

# AI providers
llm.provider=OLLAMA
embedding.provider=OLLAMA

# Ollama models
ollama.llm.model=gemma3:12b
ollama.embedding.model=paraphrase-multilingual

# --- Compare several LLMs (optional) ---
# Comma-separated Ollama models. When set, the pipeline runs once per model and writes
# results/sammenligning_<split>.csv. Leave empty to run only ollama.llm.model.
compare.models=

# --- Hugging Face (API) ---
huggingface.llm.url=https://router.huggingface.co/v1/chat/completions
huggingface.llm.model=Qwen/Qwen2.5-72B-Instruct
huggingface.embedding.url=https://router.huggingface.co/hf-inference/models/{model}/pipeline/feature-extraction
huggingface.embedding.model=BAAI/bge-m3

# --- Model settings ---
embedding.batchSize=16
naming.enabled=true

# --- Dimension reduction (UMAP) ---
umap.enabled=true
umap.dimensions=5
umap.neighbors=4

# --- Clustering (HDBSCAN) ---
hdbscan.minPoints=3
hdbscan.minClusterSize=4

# --- Output ---
output.dir=results
cache.dir=cache
evaluation.enabled=true

#
cendo.security.username=${CENDO_USERNAME}
cendo.security.password=${CENDO_PASSWORD}

